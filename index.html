<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電流計・電圧計マスター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            overscroll-behavior-y: none;
            user-select: none;
        }
        
        .screen:not(.active) { display: none !important; }
        .screen.active { animation: fadeIn 0.3s ease-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        /* キャンバスのアスペクト比を固定し、見切れを防止 */
        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 11;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 1rem;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            background: linear-gradient(145deg, #ffffff, #f3f4f6);
        }
        
        .btn-press { transition: all 0.1s; }
        .btn-press:active { transform: scale(0.96); }
        
        /* ⭕️正解演出用アニメーション */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5) translateY(20px); }
            60% { opacity: 1; transform: scale(1.1) translateY(0); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .animate-fade-out {
            animation: fadeOut 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col items-center py-6 px-4">

    <!-- 確認モーダル -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[200] hidden items-center justify-center">
        <div class="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center transform transition-all">
            <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h3 class="text-xl font-black text-gray-800 mb-2">テストを中止しますか？</h3>
            <p class="text-gray-500 text-sm font-bold mb-6">ここまでの進捗はリセットされ、<br>ホーム画面に戻ります。</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="btn-press flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl">
                    続ける
                </button>
                <button onclick="executeQuitToHome()" class="btn-press flex-1 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow-md">
                    やめる
                </button>
            </div>
        </div>
    </div>

    <!-- 正解演出用オーバーレイ -->
    <div id="correct-overlay" class="fixed inset-0 pointer-events-none flex items-center justify-center z-[100] hidden">
        <div id="correct-content" class="bg-white/90 backdrop-blur-md px-12 py-10 rounded-3xl shadow-2xl flex flex-col items-center justify-center border-4 border-green-400">
            <span class="text-green-500 text-8xl font-black mb-4">⭕️</span>
            <span class="text-3xl font-black text-green-600 tracking-wider">せいかい！</span>
        </div>
    </div>

    <div id="screen-home" class="screen active w-full max-w-md flex flex-col items-center justify-center min-h-[80vh] space-y-8">
        <div class="text-center space-y-2">
            <div class="inline-block p-4 bg-white rounded-3xl shadow-lg shadow-blue-100 mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h1 class="text-3xl font-black text-gray-800 tracking-tight">電流計・電圧計マスター</h1>
            <p class="text-gray-500 font-medium text-sm">電流計・電圧計の読み取りアプリ</p>
        </div>

        <div class="w-full space-y-4">
            <button onclick="showScreen('screen-practice-select')" class="btn-press w-full p-5 bg-white border-2 border-blue-500 hover:bg-blue-50 text-blue-700 rounded-2xl shadow-sm text-left flex flex-col items-center relative overflow-hidden">
                <span class="text-xl font-bold mb-1">電流計・電圧計 読み取り練習</span>
                <span class="text-sm text-blue-500 font-medium">測定器とコースを選んで練習する</span>
            </button>

            <button onclick="showScreen('screen-test-select')" class="btn-press w-full p-5 bg-gradient-to-br from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white rounded-2xl shadow-lg shadow-blue-200 text-left flex flex-col items-center">
                <span class="text-xl font-bold mb-1 text-white">練習問題に挑戦！</span>
                <span class="text-sm text-blue-100 font-medium">ミスなしで3問連続クリアを目指せ</span>
            </button>
        </div>
    </div>

    <div id="screen-test-select" class="screen w-full max-w-md min-h-[80vh] flex flex-col justify-center space-y-6">
        <h2 class="text-2xl font-bold text-center text-gray-800">どちらのテストを受ける？</h2>
        <div class="space-y-4">
            <button onclick="showScreen('screen-test-ammeter')" class="btn-press w-full py-5 bg-blue-500 hover:bg-blue-600 text-white rounded-2xl shadow-md text-xl font-bold flex items-center justify-center gap-3">
                <span class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">A</span>
                電流計 読み取り練習
            </button>
            <button onclick="showScreen('screen-test-voltmeter')" class="btn-press w-full py-5 bg-red-500 hover:bg-red-600 text-white rounded-2xl shadow-md text-xl font-bold flex items-center justify-center gap-3">
                <span class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">V</span>
                電圧計 読み取り練習
            </button>
        </div>
        <button onclick="showScreen('screen-home')" class="btn-press w-full py-3 text-gray-500 hover:bg-gray-100 rounded-xl font-bold mt-4">
            ホームに戻る
        </button>
    </div>

    <div id="screen-test-ammeter" class="screen w-full max-w-md min-h-[80vh] flex flex-col justify-center space-y-4">
        <div class="text-center mb-4">
            <span class="inline-block px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-bold mb-2">電流計テスト</span>
            <h2 class="text-2xl font-bold text-gray-800">コースを選択（全3問）</h2>
        </div>
        <button onclick="startTestMode('A', ['50mA', '50mA', '50mA'], '50mAコース')" class="btn-press w-full py-4 bg-white border-2 border-gray-200 hover:border-blue-400 text-gray-700 rounded-xl font-bold shadow-sm">50mA コース</button>
        <button onclick="startTestMode('A', ['500mA', '500mA', '500mA'], '500mAコース')" class="btn-press w-full py-4 bg-white border-2 border-gray-200 hover:border-blue-400 text-gray-700 rounded-xl font-bold shadow-sm">500mA コース</button>
        <button onclick="startTestMode('A', ['5A', '5A', '5A'], '5Aコース')" class="btn-press w-full py-4 bg-white border-2 border-gray-200 hover:border-blue-400 text-gray-700 rounded-xl font-bold shadow-sm">5A コース</button>
        <button onclick="startTestMode('A', ['50mA', '500mA', '5A'], 'ランダムコース')" class="btn-press w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md font-bold text-lg flex justify-center items-center gap-2 mt-4">
            ランダムコース <span class="text-xs bg-white/20 px-2 py-1 rounded-full">全種1問ずつ</span>
        </button>
        <button onclick="showScreen('screen-test-select')" class="btn-press w-full py-3 text-gray-500 hover:bg-gray-100 rounded-xl font-bold mt-2">戻る</button>
    </div>

    <div id="screen-test-voltmeter" class="screen w-full max-w-md min-h-[80vh] flex flex-col justify-center space-y-4">
        <div class="text-center mb-4">
            <span class="inline-block px-3 py-1 bg-red-100 text-red-700 rounded-full text-sm font-bold mb-2">電圧計テスト</span>
            <h2 class="text-2xl font-bold text-gray-800">コースを選択（全3問）</h2>
        </div>
        <button onclick="startTestMode('V', ['300V', '300V', '300V'], '300Vコース')" class="btn-press w-full py-4 bg-white border-2 border-gray-200 hover:border-red-400 text-gray-700 rounded-xl font-bold shadow-sm">300V コース</button>
        <button onclick="startTestMode('V', ['15V', '15V', '15V'], '15Vコース')" class="btn-press w-full py-4 bg-white border-2 border-gray-200 hover:border-red-400 text-gray-700 rounded-xl font-bold shadow-sm">15V コース</button>
        <button onclick="startTestMode('V', ['3V', '3V', '3V'], '3Vコース')" class="btn-press w-full py-4 bg-white border-2 border-gray-200 hover:border-red-400 text-gray-700 rounded-xl font-bold shadow-sm">3V コース</button>
        <button onclick="startTestMode('V', ['300V', '15V', '3V'], 'ランダムコース')" class="btn-press w-full py-4 bg-red-600 hover:bg-red-700 text-white rounded-xl shadow-md font-bold text-lg flex justify-center items-center gap-2 mt-4">
            ランダムコース <span class="text-xs bg-white/20 px-2 py-1 rounded-full">全種1問ずつ</span>
        </button>
        <button onclick="showScreen('screen-test-select')" class="btn-press w-full py-3 text-gray-500 hover:bg-gray-100 rounded-xl font-bold mt-2">戻る</button>
    </div>

    <!-- ここから追加：練習モード用の画面群 -->
    <div id="screen-practice-select" class="screen w-full max-w-md min-h-[80vh] flex flex-col justify-center space-y-6">
        <h2 class="text-2xl font-bold text-center text-gray-800">どちらの練習をする？</h2>
        <div class="space-y-4">
            <button onclick="showScreen('screen-practice-ammeter')" class="btn-press w-full py-5 bg-blue-500 hover:bg-blue-600 text-white rounded-2xl shadow-md text-xl font-bold flex items-center justify-center gap-3">
                <span class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">A</span>
                電流計の練習
            </button>
            <button onclick="showScreen('screen-practice-voltmeter')" class="btn-press w-full py-5 bg-red-500 hover:bg-red-600 text-white rounded-2xl shadow-md text-xl font-bold flex items-center justify-center gap-3">
                <span class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">V</span>
                電圧計の練習
            </button>
        </div>
        <button onclick="showScreen('screen-home')" class="btn-press w-full py-3 text-gray-500 hover:bg-gray-100 rounded-xl font-bold mt-4">
            ホームに戻る
        </button>
    </div>

    <div id="screen-practice-ammeter" class="screen w-full max-w-md min-h-[80vh] flex flex-col justify-center space-y-4">
        <div class="text-center mb-4">
            <span class="inline-block px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-bold mb-2">電流計の練習</span>
            <h2 class="text-2xl font-bold text-gray-800">コースを選択（ずっと練習）</h2>
        </div>
        <button onclick="startPracticeMode('A', 'fixed', '50mA', '50mA 集中コース')" class="btn-press w-full py-4 bg-white border-2 border-gray-200 hover:border-blue-400 text-gray-700 rounded-xl font-bold shadow-sm">50mA だけ練習</button>
        <button onclick="startPracticeMode('A', 'fixed', '500mA', '500mA 集中コース')" class="btn-press w-full py-4 bg-white border-2 border-gray-200 hover:border-blue-400 text-gray-700 rounded-xl font-bold shadow-sm">500mA だけ練習</button>
        <button onclick="startPracticeMode('A', 'fixed', '5A', '5A 集中コース')" class="btn-press w-full py-4 bg-white border-2 border-gray-200 hover:border-blue-400 text-gray-700 rounded-xl font-bold shadow-sm">5A だけ練習</button>
        <button onclick="startPracticeMode('A', 'sequence', null, 'ランダム（順番に出題）')" class="btn-press w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md font-bold text-lg mt-4">
            ランダム（順番に出題）
        </button>
        <button onclick="showScreen('screen-practice-select')" class="btn-press w-full py-3 text-gray-500 hover:bg-gray-100 rounded-xl font-bold mt-2">戻る</button>
    </div>

    <div id="screen-practice-voltmeter" class="screen w-full max-w-md min-h-[80vh] flex flex-col justify-center space-y-4">
        <div class="text-center mb-4">
            <span class="inline-block px-3 py-1 bg-red-100 text-red-700 rounded-full text-sm font-bold mb-2">電圧計の練習</span>
            <h2 class="text-2xl font-bold text-gray-800">コースを選択（ずっと練習）</h2>
        </div>
        <button onclick="startPracticeMode('V', 'fixed', '300V', '300V 集中コース')" class="btn-press w-full py-4 bg-white border-2 border-gray-200 hover:border-red-400 text-gray-700 rounded-xl font-bold shadow-sm">300V だけ練習</button>
        <button onclick="startPracticeMode('V', 'fixed', '15V', '15V 集中コース')" class="btn-press w-full py-4 bg-white border-2 border-gray-200 hover:border-red-400 text-gray-700 rounded-xl font-bold shadow-sm">15V だけ練習</button>
        <button onclick="startPracticeMode('V', 'fixed', '3V', '3V 集中コース')" class="btn-press w-full py-4 bg-white border-2 border-gray-200 hover:border-red-400 text-gray-700 rounded-xl font-bold shadow-sm">3V だけ練習</button>
        <button onclick="startPracticeMode('V', 'sequence', null, 'ランダム（順番に出題）')" class="btn-press w-full py-4 bg-red-600 hover:bg-red-700 text-white rounded-xl shadow-md font-bold text-lg mt-4">
            ランダム（順番に出題）
        </button>
        <button onclick="showScreen('screen-practice-select')" class="btn-press w-full py-3 text-gray-500 hover:bg-gray-100 rounded-xl font-bold mt-2">戻る</button>
    </div>
    <!-- 追加ここまで -->

    <div id="screen-play" class="screen w-full max-w-2xl">
        <!-- 上部ステータスバー -->
        <div class="flex justify-between items-end mb-3 px-2">
            <div>
                <span id="course-badge" class="px-3 py-1 bg-gray-800 text-white rounded-lg text-xs font-bold mr-2 hidden"></span>
                <span id="terminal-badge" class="px-3 py-1 bg-blue-600 text-white rounded-full text-sm font-bold shadow-sm"></span>
            </div>
            <div id="test-progress-container" class="hidden text-right flex-col items-end">
                <span class="text-xs text-gray-500 font-bold block mb-1">進行状況</span>
                <div class="flex gap-1" id="progress-dots"></div>
            </div>
            <div id="practice-skip-container" class="text-right">
                <button onclick="generateQuestion()" class="text-sm font-bold text-gray-500 bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded-lg btn-press">
                    次の問題へ ⏭
                </button>
            </div>
        </div>
        
        <!-- メーター描画キャンバス -->
        <div class="canvas-container relative">
            <canvas id="meterCanvas"></canvas>
        </div>

        <!-- オプション設定とヒント -->
        <div class="flex flex-col items-center gap-2 mb-5 mt-3">
            <label class="flex items-center space-x-2 bg-white px-5 py-2.5 rounded-full shadow-sm border border-gray-200 cursor-pointer btn-press">
                <input type="checkbox" id="toggle-100-scale" onchange="drawMeter()" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                <span class="text-sm font-bold text-gray-700">100刻みの数値を表示</span>
            </label>
            <div class="text-center text-xs text-gray-500 font-medium">
                ⓘ メーター下部の端子を見て、どのマイナス端子に繋がっているか確認しよう！
            </div>
        </div>

        <!-- 解答入力エリア -->
        <div class="bg-white p-5 rounded-3xl shadow-lg border border-gray-100">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                    <span class="bg-blue-100 text-blue-600 w-6 h-6 rounded-full flex items-center justify-center text-xs">Q</span>
                    いまの値はいくつ？
                </h3>
                <span class="text-xs font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded">目分量の1/10まで読んでね</span>
            </div>
            
            <div class="flex items-center gap-3 mb-6">
                <button onclick="adjustValue(-1)" class="btn-press w-16 h-16 shrink-0 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-2xl text-4xl font-bold flex items-center justify-center border-2 border-gray-200">-</button>
                <div class="flex-grow flex items-end relative">
                    <input type="text" id="answer-input" class="w-full text-center text-4xl font-bold py-3 border-b-4 border-gray-300 focus:border-blue-500 focus:outline-none bg-transparent text-gray-800" value="0.00" readonly>
                </div>
                <button onclick="adjustValue(1)" class="btn-press w-16 h-16 shrink-0 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-2xl text-4xl font-bold flex items-center justify-center border-2 border-gray-200">+</button>
                <span id="unit-label" class="text-2xl font-bold text-gray-500 w-10 text-center shrink-0">A</span>
            </div>

            <button onclick="checkAnswer()" class="btn-press w-full py-4 bg-gray-800 hover:bg-gray-900 text-white rounded-2xl shadow-lg text-xl font-bold flex justify-center items-center gap-2">
                答える
            </button>
        </div>
        
        <div class="mt-6 text-center">
            <button onclick="quitToHome()" class="text-sm text-gray-400 hover:text-gray-600 font-bold underline underline-offset-4">やめてホームに戻る</button>
        </div>
    </div>

    <div id="screen-result" class="screen w-full max-w-md bg-white p-8 rounded-3xl shadow-2xl border-2 text-center mt-10 relative overflow-hidden">
        <div id="result-icon" class="w-24 h-24 mx-auto rounded-full flex items-center justify-center text-5xl shadow-inner mb-6 relative z-10"></div>
        <h2 id="result-title" class="text-3xl font-black mb-2 relative z-10"></h2>
        <p id="result-subtitle" class="text-gray-500 font-bold mb-6 relative z-10"></p>

        <!-- ミスした場合の解説表示エリア -->
        <div id="result-explanation" class="hidden text-left bg-gray-50 p-5 rounded-2xl mb-8 border border-gray-200 relative z-10">
            <p class="text-sm text-gray-600 font-bold mb-2">間違えた問題の確認</p>
            <div class="space-y-3">
                <div class="flex justify-between items-center border-b pb-2">
                    <span class="text-sm text-gray-500">あなたの回答</span>
                    <span id="res-user-ans" class="text-lg font-bold text-red-500 line-through"></span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm text-gray-500">正しい正解</span>
                    <span id="res-correct-ans" class="text-2xl font-black text-blue-600"></span>
                </div>
                <p id="res-hint" class="text-xs text-gray-600 mt-3 bg-yellow-50 p-3 rounded border border-yellow-200 leading-relaxed"></p>
            </div>
        </div>

        <button onclick="showScreen('screen-home')" class="btn-press w-full py-4 bg-gray-800 hover:bg-gray-900 text-white rounded-2xl shadow-lg text-lg font-bold relative z-10">
            ホーム画面に戻る
        </button>
    </div>

    <script>
        // === 状態管理 ===
        const state = {
            mode: 'practice', 
            practiceType: 'fixed',
            fixedTerminal: '',
            sequenceArr: [],
            sequenceIndex: 0,
            courseName: '',
            meterType: 'A',
            terminal: '5A',
            
            testQueue: [],
            currentQuestionIndex: 0,
            
            targetPos: 0,     // 区画位置 (例: 35.5)
            correctStr: "",   // 正解の文字 (例: "3.55")
            currentInputVal: 0, // 入力値の内部データ
            
            // 各端子の設定 (max:最大値, step:1区画の値, decimals:答える小数点桁数)
            configs: {
                'A': {
                    '5A': { max: 5, step: 0.1, decimals: 2, unit: 'A' },       
                    '500mA': { max: 500, step: 10, decimals: 0, unit: 'mA' }, 
                    '50mA': { max: 50, step: 1, decimals: 1, unit: 'mA' }      
                },
                'V': {
                    '300V': { max: 300, step: 10, decimals: 0, unit: 'V' },   
                    '15V': { max: 15, step: 0.5, decimals: 2, unit: 'V' },    
                    '3V': { max: 3, step: 0.1, decimals: 2, unit: 'V' }       
                }
            }
        };

        const ui = {
            input: document.getElementById('answer-input'),
            unit: document.getElementById('unit-label'),
            canvas: document.getElementById('meterCanvas'),
            terminalBadge: document.getElementById('terminal-badge'),
            progressContainer: document.getElementById('test-progress-container'),
            progressDots: document.getElementById('progress-dots'),
            practiceSkip: document.getElementById('practice-skip-container'),
            courseBadge: document.getElementById('course-badge'),
            toggle100: document.getElementById('toggle-100-scale')
        };
        const ctx = ui.canvas.getContext('2d');

        // === リサイズハンドリング ===
        window.addEventListener('resize', resizeCanvas);
        function resizeCanvas() {
            const container = ui.canvas.parentElement;
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            ui.canvas.width = rect.width * dpr;
            ui.canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            if(document.getElementById('screen-play').classList.contains('active')){
                drawMeter();
            }
        }

        // === 画面遷移ロジック ===
        function showScreen(screenId) {
            const target = document.getElementById(screenId);
            if (!target) {
                console.error("Screen not found: " + screenId);
                return; // 画面が見つからない場合はエラーを出して処理を中断し、クラッシュを防ぐ
            }
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            target.classList.add('active');
            if(screenId === 'screen-play') {
                // 画面が表示されてサイズが確定してからリサイズ処理を行う
                setTimeout(() => {
                    resizeCanvas();
                    drawMeter();
                }, 10);
            }
        }

        function quitToHome() {
            if (state.mode === 'test') {
                const modal = document.getElementById('confirm-modal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                executeQuitToHome();
            }
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function executeQuitToHome() {
            closeConfirmModal();
            showScreen('screen-home');
        }

        function startPracticeMode(meterType, practiceType, fixedTerminal, courseName) {
            state.mode = 'practice';
            state.meterType = meterType;
            state.practiceType = practiceType;
            state.courseName = courseName;
            
            if (practiceType === 'sequence') {
                if (meterType === 'A') {
                    state.sequenceArr = ['50mA', '500mA', '5A'];
                } else {
                    state.sequenceArr = ['300V', '15V', '3V'];
                }
                state.sequenceIndex = 0;
            } else {
                state.fixedTerminal = fixedTerminal;
            }

            ui.progressContainer.classList.add('hidden');
            ui.practiceSkip.classList.remove('hidden');
            ui.courseBadge.classList.remove('hidden');
            ui.courseBadge.textContent = courseName;
            
            // 順番を入れ替え：先に画面を表示させてから問題を生成・描画する
            showScreen('screen-play');
            generateQuestion();
        }

        function startTestMode(meterType, terminals, courseName) {
            state.mode = 'test';
            state.meterType = meterType;
            state.courseName = courseName;
            
            // 配列をシャッフル（ランダムコースの場合はシャッフルされる）
            state.testQueue = [...terminals].sort(() => Math.random() - 0.5);
            state.currentQuestionIndex = 0;
            
            ui.progressContainer.classList.remove('hidden');
            ui.practiceSkip.classList.add('hidden');
            
            ui.courseBadge.textContent = courseName;
            ui.courseBadge.classList.remove('hidden');

            updateProgressUI();
            
            // 順番を入れ替え：先に画面を表示させてから問題を生成・描画する
            showScreen('screen-play');
            generateQuestion(state.testQueue[state.currentQuestionIndex]);
        }

        function updateProgressUI() {
            ui.progressDots.innerHTML = '';
            for(let i=0; i<3; i++) {
                const dot = document.createElement('div');
                dot.className = `w-4 h-4 rounded-full shadow-sm ${i < state.currentQuestionIndex ? 'bg-green-500' : (i === state.currentQuestionIndex ? 'bg-blue-500 animate-pulse' : 'bg-gray-200')}`;
                ui.progressDots.appendChild(dot);
            }
        }

        function generateQuestion(specificTerminal = null) {
            if (state.mode === 'practice') {
                if (state.practiceType === 'sequence') {
                    state.terminal = state.sequenceArr[state.sequenceIndex];
                    state.sequenceIndex = (state.sequenceIndex + 1) % state.sequenceArr.length;
                } else {
                    state.terminal = state.fixedTerminal;
                }
            } else {
                state.terminal = specificTerminal;
            }

            const config = state.configs[state.meterType][state.terminal];
            // 電流計は50目盛り、電圧計は30目盛り
            const maxTicks = state.meterType === 'A' ? 50 : 30;

            // 針の位置決定: 目盛りの線上(0) か、真ん中(0.5)
            // 答えが0にならないように再抽選する
            do {
                const tick = Math.floor(Math.random() * maxTicks);
                const subTick = Math.random() > 0.5 ? 0 : 0.5;
                state.targetPos = tick + subTick; 
            } while (state.targetPos === 0);

            // 正解の計算
            const val = state.targetPos * config.step;
            state.correctStr = val.toFixed(config.decimals);
            
            // 入力リセット
            state.currentInputVal = 0;
            updateInputDisplay();
            
            // UI更新
            ui.unit.textContent = config.unit;
            const badgeColor = state.meterType === 'A' ? 'bg-blue-600' : 'bg-red-600';
            ui.terminalBadge.textContent = `接続: ${state.terminal} 端子`;
            ui.terminalBadge.className = `px-3 py-1 text-white rounded-full text-sm font-bold shadow-sm ${badgeColor}`;

            drawMeter();
        }

        function adjustValue(direction) {
            const config = state.configs[state.meterType][state.terminal];
            // 1回の+ - で、最小目盛りの半分(0.5区画)ずつ動く
            const inputStep = config.step * 0.5; 
            
            state.currentInputVal += direction * inputStep;
            // 浮動小数点誤差の補正
            state.currentInputVal = Math.round(state.currentInputVal * 1000) / 1000;
            
            // 0未満になったら最大値へループ、最大値を超えたら0へループ
            if (state.currentInputVal < 0) {
                state.currentInputVal = config.max;
            } else if (state.currentInputVal > config.max) {
                state.currentInputVal = 0;
            }
            
            updateInputDisplay();
        }

        function updateInputDisplay() {
            const config = state.configs[state.meterType][state.terminal];
            ui.input.value = state.currentInputVal.toFixed(config.decimals);
        }

        function checkAnswer() {
            const userStr = ui.input.value;
            const isCorrect = (userStr === state.correctStr);

            if (isCorrect) {
                showFeedbackEffect(true);
                if (state.mode === 'practice') {
                    setTimeout(() => generateQuestion(), 1300);
                } else {
                    state.currentQuestionIndex++;
                    if (state.currentQuestionIndex >= 3) {
                        setTimeout(() => showResultScreen(true), 1300);
                    } else {
                        updateProgressUI();
                        setTimeout(() => generateQuestion(state.testQueue[state.currentQuestionIndex]), 1300);
                    }
                }
            } else {
                showFeedbackEffect(false);
                if (state.mode === 'test') {
                    setTimeout(() => showResultScreen(false), 800);
                }
            }
        }

        function showFeedbackEffect(isCorrect) {
            const el = ui.input;
            if (isCorrect) {
                el.classList.add('bg-green-100', 'text-green-700', 'border-green-500');
                
                // ⭕️演出の表示
                const overlay = document.getElementById('correct-overlay');
                const content = document.getElementById('correct-content');
                overlay.classList.remove('hidden');
                content.classList.remove('animate-fade-out');
                content.classList.add('animate-pop-in');

                // 一定時間後に非表示へ
                setTimeout(() => {
                    content.classList.remove('animate-pop-in');
                    content.classList.add('animate-fade-out');
                    setTimeout(() => {
                        overlay.classList.add('hidden');
                    }, 300); // フェードアウトを待つ
                    el.classList.remove('bg-green-100', 'text-green-700', 'border-green-500');
                }, 1000);

            } else {
                el.classList.add('shake', 'bg-red-100', 'text-red-700', 'border-red-500');
                setTimeout(() => el.classList.remove('shake', 'bg-red-100', 'text-red-700', 'border-red-500'), 500);
            }
        }

        function showResultScreen(isClear) {
            const resScreen = document.getElementById('screen-result');
            const icon = document.getElementById('result-icon');
            const title = document.getElementById('result-title');
            const sub = document.getElementById('result-subtitle');
            const exp = document.getElementById('result-explanation');

            resScreen.className = `screen active w-full max-w-md bg-white p-8 rounded-3xl shadow-2xl border-4 ${isClear ? 'border-green-400' : 'border-red-400'} text-center mt-10 relative overflow-hidden`;
            icon.className = `w-24 h-24 mx-auto rounded-full flex items-center justify-center text-5xl shadow-inner mb-6 relative z-10 ${isClear ? 'bg-green-500 text-white shadow-green-200' : 'bg-red-500 text-white shadow-red-200'}`;
            
            if (isClear) {
                icon.innerHTML = "🎉";
                title.textContent = "クリア！";
                title.className = "text-3xl font-black mb-2 relative z-10 text-green-600";
                sub.textContent = `${state.courseName} 3問連続正解達成！`;
                exp.classList.add('hidden');
            } else {
                icon.innerHTML = "💦";
                title.textContent = "ゲームオーバー";
                title.className = "text-3xl font-black mb-2 relative z-10 text-red-600";
                sub.textContent = "おしい！間違えちゃったみたい。";
                
                exp.classList.remove('hidden');
                document.getElementById('res-user-ans').textContent = ui.input.value + state.configs[state.meterType][state.terminal].unit;
                document.getElementById('res-correct-ans').textContent = state.correctStr + state.configs[state.meterType][state.terminal].unit;
                
                const conf = state.configs[state.meterType][state.terminal];
                document.getElementById('res-hint').innerHTML = `💡 <b>${state.terminal}端子</b> なので、1目盛りは <b>${conf.step} ${conf.unit}</b> です。<br>目分量で1/10まで読むルールなので、必ず <b>小数点以下${conf.decimals}桁</b> まで答えるのが正解です。`;
            }

            showScreen('screen-result');
        }

        function drawMeter() {
            // エラー回避：キャンバスのサイズが0（非表示）の時は描画をキャンセルする
            if (ui.canvas.width === 0 || ui.canvas.height === 0) return;

            const w = ui.canvas.width / (window.devicePixelRatio || 1);
            const h = ui.canvas.height / (window.devicePixelRatio || 1);
            
            // エラー回避2：計算上の幅や高さが不正な場合もキャンセル
            if (w <= 0 || h <= 0) return;

            ctx.clearRect(0, 0, w, h);

            // メーター中心の座標。全体を上に引き上げて端子のスペースを確保
            const cx = w / 2;
            const cy = h * 0.70; 
            const radius = Math.min(w * 0.42, h * 0.58); 
            
            const startAngle = Math.PI * 1.15; // 左下
            const endAngle = Math.PI * 1.85;   // 右下

            drawBackground(w, h);
            drawScale(cx, cy, radius, startAngle, endAngle);
            drawNeedle(cx, cy, radius, startAngle, endAngle);
            drawCover(cx, cy, radius);
            drawTerminals(w, h); // 端子は専用の絶対座標で描画
        }

        function drawBackground(w, h) {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.roundRect(w*0.02, h*0.02, w*0.96, h*0.96, 15);
            ctx.fill();
            ctx.strokeStyle = '#e5e7eb';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawScale(cx, cy, radius, startAngle, endAngle) {
            const maxTicks = state.meterType === 'A' ? 50 : 30;
            const show100 = ui.toggle100.checked;
            
            // 外側の円弧
            ctx.beginPath();
            ctx.arc(cx, cy, radius, startAngle, endAngle);
            ctx.strokeStyle = '#111827';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#111827';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            for (let i = 0; i <= maxTicks; i++) {
                const angle = startAngle + (endAngle - startAngle) * (i / maxTicks);
                const cosA = Math.cos(angle);
                const sinA = Math.sin(angle);
                
                let lineLength = radius * 0.04;
                let isMajor = false;
                
                if (i % 10 === 0) {
                    lineLength = radius * 0.09; 
                    isMajor = true;
                } else if (i % 5 === 0) {
                    lineLength = radius * 0.06; 
                }

                ctx.beginPath();
                ctx.moveTo(cx + radius * cosA, cy + radius * sinA);
                ctx.lineTo(cx + (radius - lineLength) * cosA, cy + (radius - lineLength) * sinA);
                ctx.lineWidth = isMajor ? 3 : 1.5;
                ctx.stroke();

                // ラベルの描画
                if (isMajor) {
                    const fontSize = Math.max(12, radius * 0.07);
                    ctx.font = `bold ${fontSize}px Inter`;
                    
                    if (state.meterType === 'A') {
                        // 50mA (中央)
                        drawTextAlongArc(cx, cy, radius - radius * 0.16, angle, (i * 1).toString());
                        // 5A (外側・上)
                        drawTextAlongArc(cx, cy, radius + radius * 0.10, angle, (i / 10).toString());
                        // 500mA (内側 - チェック時のみ)
                        if (show100) drawTextAlongArc(cx, cy, radius - radius * 0.28, angle, (i * 10).toString());
                    } else {
                        // Vの場合
                        // 15V (中央)
                        drawTextAlongArc(cx, cy, radius - radius * 0.16, angle, (i / 2).toString());
                        // 3V (外側・上)
                        drawTextAlongArc(cx, cy, radius + radius * 0.10, angle, (i / 10).toString());
                        // 300V (内側 - チェック時のみ)
                        if (show100) drawTextAlongArc(cx, cy, radius - radius * 0.28, angle, (i * 10).toString());
                    }
                }
            }

            // A / V 記号
            ctx.fillStyle = '#111827';
            ctx.font = `bold ${Math.max(24, radius * 0.18)}px Inter`;
            ctx.fillText(state.meterType === 'A' ? 'A' : 'V', cx, cy - radius * 0.45);
            
            // 直流記号
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 12, cy - radius * 0.35);
            ctx.lineTo(cx + 12, cy - radius * 0.35);
            ctx.stroke();
            ctx.beginPath();
            ctx.setLineDash([4, 2]);
            ctx.moveTo(cx - 12, cy - radius * 0.31);
            ctx.lineTo(cx + 12, cy - radius * 0.31);
            ctx.stroke();
            ctx.setLineDash([]); 
        }

        function drawTextAlongArc(cx, cy, textRadius, angle, text) {
            ctx.fillText(text, cx + textRadius * Math.cos(angle), cy + textRadius * Math.sin(angle));
        }

        function drawTerminals(w, h) {
            // 端子のY座標を下部に固定（枠のはみ出しを防ぎつつ、カバーを避ける）
            const termY = h * 0.88; 
            const termRadius = Math.min(w * 0.035, 18);
            
            // プラス端子 (右側)
            const posX = w * 0.85;
            drawSingleTerminal(posX, termY, termRadius, '#ef4444', '+');
            drawCable(posX, termY, termRadius, '#ef4444', w, h, 'right');

            // マイナス端子群 (左側に寄せて、中央のカバーを避ける)
            const minusTerminals = state.meterType === 'A' ? ['50mA', '500mA', '5A'] : ['300V', '15V', '3V'];
            
            // 3つの端子を x=0.12, 0.25, 0.38 付近に配置
            const startX = w * 0.12; 
            const gap = w * 0.135; 

            for (let i = 0; i < 3; i++) {
                const tx = startX + gap * i;
                const label = minusTerminals[i];
                const isActive = label === state.terminal;
                
                drawSingleTerminal(tx, termY, termRadius, '#111827', label);
                if (isActive) {
                    drawCable(tx, termY, termRadius, '#1f2937', w, h, 'left');
                }
            }
        }

        function drawSingleTerminal(x, y, r, color, label) {
            ctx.beginPath();
            ctx.arc(x, y+2, r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(x, y, r * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = '#4b5563';
            ctx.fill();

            // ラベル文字
            ctx.fillStyle = '#4b5563';
            ctx.font = `bold ${Math.max(11, r * 0.75)}px Inter`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(label, x, y - r - 5);
        }

        function drawCable(x, y, r, color, w, h, dir) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.bezierCurveTo(x, y + 40, x + (dir==='right'? 20 : -20), h + 20, x + (dir==='right'? 40 : -40), h + 20);
            ctx.lineWidth = r * 0.8;
            ctx.strokeStyle = color;
            ctx.stroke();
        }

        function drawNeedle(cx, cy, radius, startAngle, endAngle) {
            const maxTicks = state.meterType === 'A' ? 50 : 30;
            const angle = startAngle + (endAngle - startAngle) * (state.targetPos / maxTicks);
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            
            const needleLength = radius * 1.05;
            ctx.beginPath();
            ctx.moveTo(0, -2); 
            ctx.lineTo(needleLength, 0); 
            ctx.lineTo(0, 2); 
            ctx.fillStyle = '#ef4444'; 
            ctx.fill();
            ctx.restore();
        }
        
        function drawCover(cx, cy, radius) {
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.22, Math.PI, Math.PI * 2);
            ctx.fillStyle = '#f9fafb';
            ctx.fill();
            ctx.strokeStyle = '#d1d5db';
            ctx.lineWidth = 1;
            ctx.stroke();
            
            // ネジ
            const screwRadius = radius * 0.03;
            ctx.beginPath();
            ctx.arc(cx - radius * 0.10, cy - radius * 0.06, screwRadius, 0, Math.PI * 2);
            ctx.arc(cx + radius * 0.10, cy - radius * 0.06, screwRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#9ca3af';
            ctx.fill();
            
            // 針の中心
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.06, 0, Math.PI * 2);
            ctx.fillStyle = '#111827';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.02, 0, Math.PI * 2);
            ctx.fillStyle = '#e5e7eb';
            ctx.fill();
        }

    </script>
</body>
